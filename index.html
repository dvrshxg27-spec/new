<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>♡</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">

<style>
:root{
  --pale:#FFF0F7; --pastel:#FFD6E9; --medium:#FF8FC7; --strong:#E85CA7; --text:#65314E;
  --font:"Fredoka",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --script:"Pacifico","Brush Script MT",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:var(--font);font-size:17px;line-height:1.6;color:var(--text);background:#000;overflow-x:clip}
body.unlocked{background-color:var(--pale);background-image:radial-gradient(var(--pastel) 2.2px,transparent 2.8px);background-size:28px 28px}
[hidden]{display:none!important}

/* ===== PAGE 1: plain black password screen ===== */
#gate{min-height:100vh;min-height:100dvh;background:#000;display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px}
#gate input{width:100%;height:50px;padding:0 14px;border:1px solid #444;border-radius:6px;background:#000;color:#fff;font:400 18px var(--font);text-align:center;outline:none}
#gate input:focus{border-color:#888}
#gate button{height:50px;border:1px solid #444;border-radius:6px;background:#000;color:#fff;font:400 17px var(--font);cursor:pointer}
#gate button:active{background:#1a1a1a}
#err{min-height:1.4em;margin:0;text-align:center;color:#bbb;font-size:15px}
#hint{margin:-2px 0 0;text-align:center;color:#8a8a8a;font-size:14px;line-height:1.4}

/* ===== PAGE 2: happy birthday ===== */
.page{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 40px) calc(env(safe-area-inset-left,0px) + 16px);background:linear-gradient(180deg,rgba(255,214,233,.55),transparent 45%);animation:pageIn .6s ease both}
.fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl span{position:absolute;bottom:-40px;color:var(--medium);opacity:0;animation:up linear infinite}
.card{position:relative;z-index:1;width:100%;max-width:560px;margin:82px auto 0;padding:34px 22px 30px;text-align:center;background:#fff;border-radius:36px;box-shadow:0 0 0 4px var(--pastel),0 10px 26px rgba(232,92,167,.22)}
.card svg{width:min(46vw,168px);margin:-108px auto 4px;display:block;filter:drop-shadow(0 8px 10px rgba(232,92,167,.3));animation:bob 4s ease-in-out infinite}
.kicker{margin:0;font-family:var(--script);color:var(--medium);font-size:1.2rem}
.hero{margin:6px 0 18px;font-weight:600;line-height:1.15;font-size:clamp(2.1rem,10.5vw,3rem);color:var(--strong);text-shadow:0 3px 0 var(--pastel);text-wrap:balance}
.divider{margin:0 0 20px;color:var(--medium);letter-spacing:.5em;font-size:.9rem}
.msg{margin:0;font-size:1.08rem;text-align:left;white-space:pre-line;overflow-wrap:anywhere}
.msg p{margin:0 0 1.05em}
.sign{margin:22px 0 0;font-family:var(--script);font-size:1.3rem;line-height:1.7;color:var(--strong);white-space:pre-line}
.stickers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 0;padding:0;list-style:none}
.stickers li{padding:6px 14px;border-radius:999px;font-size:.92rem;background:var(--pale);border:2px dashed var(--medium);transform:rotate(-2deg)}
.stickers li:nth-child(2n){transform:rotate(2.5deg)}
.mute{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:var(--strong);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 0 0 3px var(--pastel),0 6px 14px rgba(232,92,167,.25)}
.mute:active{transform:scale(.94)}

@media(min-width:700px){.card{padding:40px 44px 36px}.msg{font-size:1.15rem}}
@media(max-width:340px){body{font-size:16px}.card{padding:30px 16px 26px}}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes up{0%{transform:translateY(0);opacity:0}12%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-115vh);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.fl{display:none}}
</style>
</head>

<body>

<!-- PAGE 1: plain black password screen -->
<div id="gate">
  <form id="form" autocomplete="off">
    <input id="pw" type="password" placeholder="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Password">
    <p id="hint" hidden></p>
    <button type="submit">Unlock</button>
    <p id="err" role="alert"></p>
  </form>
</div>

<div id="app" hidden></div>

<script>
/* ==========================================================================
   ✏️  EDIT HERE  (the only part you need to touch)
   Keep the "quotes" and the commas / semicolons.
   ========================================================================== */

// 🔑 THE PASSWORD — change the text between the quotes.
// (Capital letters don't matter: "OurLove" and "ourlove" both work.)
var PASSWORD = "10-9-2025";

// 💡 HINT shown under the password box ("" for no hint). Change it to something only she would get.
var HINT = "hint: First time we met outside (??-?-????)";

// 🎵 BACKGROUND MUSIC (starts after the right password)
// By default a soft, gentle music-box tune is generated right in the browser, so there's nothing to upload.
// Want your own song instead? Put the audio file (e.g. song.mp3) in the same folder as this page
// and type its name here: var MUSIC_FILE = "song.mp3";
var MUSIC_FILE = "music.mp3";
// How loud the music is, from 0 (silent) to 1 (full). Soft is around 0.3.
var MUSIC_VOLUME = 0.01;

// Small line above the big heading
var KICKER = "for my lil kittyyy";

var HEADING = "Happy Birthday, My Cutiepie! 🎂💗";

// 💌 THE BIG MESSAGE
// • Start a new paragraph by typing \n\n   (backslash n, twice)
// • Don't use a plain " inside the text (it breaks things). Use ' or ” instead.
// • Each line ends with  +  except the last one, which ends with  ;
var MESSAGE =
  "Happy birthday my cutie meoww, today is the day when my smoll little baby is turning 16, ur slowly becoming a big girl, will u leave dadda when ur big? >_<. well ik u wont muhehehe, ik todays gonna be a rlly exciting day for you, so take ur time and enjoy it well oki, cz its a special day tht comes only once a year noh.\n\n" +

  "I cnt believe how fast babies grow up :(, like wot do u mean u were only 14 when i fell in love with you, n now in the blink of an eye ur suddenly 16, its just so shocking T-T" +
  "but its okii the older u grow the sooner we get married n live together, as the years pass, u continue to grow so much, ur alr incomparable to last year when u were just a 14 yo baby hmph, youve grown both emotionally and especially physically 0_<, muhehehe." +
  "but well no matter how many years go past, no matter how the numbers of ur ages fly by, i hope youll always continue to grow, and tht youll be a bit closer to happiness everyday tht u wake up, and in all of those years i should and i will forever be right next to you.\n\n" +

  "In all ur laughter, and in all ur tears, through every sleepless night, and ever exciting event, ill be there right next you always ( ngl this would soung creepy if the website was dark themed T-T ) " +
  "I cnt believe how far weve managed to come tgt in just this small but still such a long year, i hope every year from now, n every year after, well always continue to be tgt. its hard to believe how this cute lil baby has managed to conquer every corner of my heart, and life. its surprising but at the same time so relieving how weve ended up tgt, n all i could ever ask for in this world is tht it continues to stay like this hehehe." +
  "ik the past year has been rlly hard for you, but as the only person who saw u struggle thru it all, ik youll make it thru no matter what problem may come ur way. my next line might sound cringey but its tru hmph- ur my favourite hello as well as the worst goodbye, i hope this year give u everything u deserve n more, i hope its filled with laughter, good food, soft mornings, and everything tht makes my baby happy, and thru it all i promise to always be there, and to always be ur loudest supporter.\n\n" +

  "No matter how big u get, i hope you know tht youll always, forever be just my cute lil baby, so no matter wot happens, no matter wot problem might come onto you, never ever hesitate to come to me oki baby? Ill always be there to help you, no matter how angwy i am or how sad i may be, even if were not tgt anymore, just know tht ill always be there whenever u may need me." +
  "I love you, I love you, I love you, n ill always continue to, no amount of words are enough to express how much i love you, but whenever u doubt it just huggie me oki? theres no feeling tht my heartbeat wont be able to convey. I hope ill always be the one u seek after a long hard day, i hope ill always be a part of every good memory, i hope i never become a burden to you in anything, so no matter wot, come to me, if ur angry, sad, missing me, hungry, wtvr just come to me, even if theres absolutely no reason, come to me understood?" +
  "My cutie little baby meow, i hope yk how much u mean to me, n i hope u always cherish urself hmph, never ever think ur not good enough understood bubs? cz i assure u youll always be enough hmph, No matter wot u do, just know tht ill always be praying for your success, so always be confident oki?\n\n" +

  "Thank you for loving me the way you do, and i hope you always know how proud i am, you manage to shock me in everything u do, cz ur always just so better than my expectations, i hope you know just how much i cherish you, im not exaggerating when i say this, but i am just so glad tht u were born, and tht u ended up in the same class as me, and tht u sent me tht one follow request hehehe, i love u so much, and we both know how lucky i am to hv you hmph. " +
  "I love you so damn much, more than any message could convey, so just know im right behind you handling everything, so be at peace, and enjoy ur birthday oki cutiepie. 💗";

// Sign-off under the message ("" for none). \n = new line.
var SIGN_OFF = "Forever yours,\n Darsh fcking Gulia 💗";

// Little stickers at the bottom. Add, remove or leave as [] for none.
var STICKERS = ["✨ I love you", "🎀 Mwuahhh"];

/* ==========================================================================
   ⚙️  EVERYTHING BELOW IS THE ENGINE — no need to edit.
   ========================================================================== */
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };

  // builds elements safely: text is never treated as HTML
  function h(tag, props) {
    var el = document.createElement(tag); props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k]; if (v == null || v === false) return;
      if (k === 'class') el.className = v; else if (k === 'text') el.textContent = v; else el.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c) el.appendChild(c.nodeType ? c : document.createTextNode(c)); }
    return el;
  }

  function floaters() {
    var sym = ['💗', '✨', '🎀', '⭐', '♡', '🌸'], box = h('div', { class: 'fl', 'aria-hidden': 'true' });
    for (var i = 0; i < 14; i++) {
      var s = h('span', { text: sym[i % sym.length] });
      s.style.left = (Math.random() * 92 + 2) + '%'; s.style.fontSize = (12 + Math.random() * 14) + 'px';
      s.style.animationDuration = (14 + Math.random() * 14) + 's'; s.style.animationDelay = (-Math.random() * 24) + 's';
      box.appendChild(s);
    }
    return box;
  }

  // a bow drawn from simple shapes (original artwork)
  function bow() {
    var d = document.createElement('div');
    d.innerHTML = '<svg viewBox="0 0 120 84" aria-hidden="true"><path d="M60 42C40 8 8 6 6 29c-1 23 30 33 54 13Z" fill="var(--medium)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M60 42C80 8 112 6 114 29c1 23-30 33-54 13Z" fill="var(--medium)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M57 48 38 78l16-6 6 10Z" fill="var(--strong)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M63 48l19 30-16-6-6 10Z" fill="var(--strong)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><ellipse cx="30" cy="22" rx="11" ry="5" fill="#fff" opacity=".45" transform="rotate(-25 30 22)"/><ellipse cx="90" cy="22" rx="11" ry="5" fill="#fff" opacity=".45" transform="rotate(25 90 22)"/><circle cx="60" cy="42" r="12" fill="var(--strong)" stroke="#fff" stroke-width="3"/><circle cx="56" cy="38" r="3.2" fill="#fff" opacity=".6"/></svg>';
    return d.firstChild;
  }

  // the birthday page is only built AFTER the right password, so it doesn't exist before that
  function buildBirthday() {
    var paras = String(MESSAGE).split(/\n\s*\n/).map(function (p) { return h('p', { text: p.replace(/\n/g, ' ').trim() }); });
    var stickers = Array.isArray(STICKERS) ? STICKERS : [];
    var card = h('div', { class: 'card' }, bow(),
      KICKER ? h('p', { class: 'kicker', text: KICKER }) : null,
      h('h1', { class: 'hero', text: HEADING }),
      h('div', { class: 'divider', 'aria-hidden': 'true', text: '♡ ♡ ♡' }),
      (function () { var m = h('div', { class: 'msg' }); paras.forEach(function (p) { m.appendChild(p); }); return m; })(),
      SIGN_OFF ? h('p', { class: 'sign', text: SIGN_OFF }) : null,
      stickers.length ? (function () { var u = h('ul', { class: 'stickers' }); stickers.forEach(function (s) { u.appendChild(h('li', { text: s })); }); return u; })() : null);
    return h('section', { class: 'page' }, floaters(), card);
  }

  // ---- background music: your own file if MUSIC_FILE is set, otherwise a soft generated music-box tune ----
  var music = (function () {
    var ctx, master, lp, timer, audio, fadeTimer, on = false, started = false;
    var vol = Math.max(0, Math.min(1, Number(MUSIC_VOLUME) || 0.3));
    var BEAT = 0.46, ARP = [0, 1, 2, 3, 2, 1, 2, 1];
    var CHORDS = [[60, 64, 67, 72], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]]; // C, Am, F, G
    var hz = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };

    function pluck(m, t) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = hz(m + 12);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.16, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + 1.9);
    }
    function pad(m, t, len) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = hz(m);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 1.2);
      g.gain.setValueAtTime(0.07, t + len - 1.2); g.gain.linearRampToValueAtTime(0.0001, t + len);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + len + 0.1);
    }
    var step = 0, next = 0;
    function tick() {
      while (next < ctx.currentTime + 0.9) {
        var i = step % 8, chord = CHORDS[Math.floor(step / 8) % 4];
        if (i === 0) pad(chord[0] - 12, next, BEAT * 8);
        pluck(chord[ARP[i]], next);
        next += BEAT; step++;
      }
    }
    function startSynth() {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.0001;
      lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      var dly = ctx.createDelay(1.5), fb = ctx.createGain(), wet = ctx.createGain();
      dly.delayTime.value = 0.55; fb.gain.value = 0.38; wet.gain.value = 0.45;
      lp.connect(master); lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);
      master.connect(ctx.destination);
      master.gain.linearRampToValueAtTime(vol, ctx.currentTime + 3);   // gentle fade-in
      next = ctx.currentTime + 0.2; tick(); timer = setInterval(tick, 200);
    }
    function startFile() {
      audio = new Audio(MUSIC_FILE); audio.loop = true; audio.volume = 0;
      var p = audio.play(); if (p && p.catch) p.catch(function () {});
      var v = 0; fadeTimer = setInterval(function () { v += vol / 30; audio.volume = Math.min(vol, v); if (v >= vol) clearInterval(fadeTimer); }, 100);
    }
    function pause() { on = false; if (audio) audio.pause(); else if (ctx) ctx.suspend(); }
    function resume() { on = true; if (audio) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); } else if (ctx) ctx.resume(); }
    document.addEventListener('visibilitychange', function () {   // pause when the tab/phone screen is hidden
      if (!started) return;
      if (document.hidden) { if (on) { if (audio) audio.pause(); else if (ctx) ctx.suspend(); } }
      else if (on) resume();
    });
    return {
      start: function () { if (started) return; started = true; on = true; try { MUSIC_FILE ? startFile() : startSynth(); } catch (e) {} },
      toggle: function () { if (!started) return false; on ? pause() : resume(); return on; }
    };
  })();

  function muteButton() {
    var b = h('button', { class: 'mute', type: 'button', 'aria-label': 'Turn music off', text: '🔊' });
    b.addEventListener('click', function () {
      var playing = music.toggle();
      b.textContent = playing ? '🔊' : '🔇';
      b.setAttribute('aria-label', playing ? 'Turn music off' : 'Turn music on');
    });
    return b;
  }

  if (HINT) { var hintEl = $('#hint'); hintEl.textContent = HINT; hintEl.hidden = false; }

  var tries = 0;
  $('#form').addEventListener('submit', function (e) {
    e.preventDefault();
    var typed = $('#pw').value.trim().toLowerCase();
    if (typed && typed === String(PASSWORD).trim().toLowerCase()) {
      music.start();                                       // must run here, inside the tap/click, so browsers allow sound
      var app = $('#app'); app.appendChild(buildBirthday()); app.appendChild(muteButton());
      $('#gate').remove();                                 // the black screen is removed completely
      document.body.classList.add('unlocked');
      $('meta[name="theme-color"]').setAttribute('content', '#FFF0F7');
      document.title = 'Happy Birthday 💗';
      app.hidden = false; window.scrollTo(0, 0);
      return;
    }
    $('#err').textContent = tries++ % 2 ? 'Not quite. Try again.' : 'Wrong password.';
    $('#pw').value = ''; $('#pw').focus();
  });
})();
</script>
</body>
</html>
